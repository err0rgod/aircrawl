name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
          playwright install --with-deps chromium

      - name: Run Pytest Suite
        run: |
          pytest -v

  deploy:
    name: Deploy Tagged Release to Production
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Lightsail Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            echo "Deploying release ${{ github.ref_name }} to AirCrawl..."
            cd /home/ubuntu/aircrawl
            git fetch --tags
            git checkout ${{ github.ref_name }}
            source .venv/bin/activate
            pip install -r requirements.txt
            sudo systemctl restart aircrawl
            echo "AirCrawl release ${{ github.ref_name }} successfully deployed and live!"
